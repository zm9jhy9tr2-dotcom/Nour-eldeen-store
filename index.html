<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محلات نور الدين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --accent-gold: #fbbf24;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #10b981;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.2s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding-bottom: 80px;
        }

        header {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            color: var(--accent-gold);
        }

        .logo-area p {
            margin: 0;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .cart-icon-wrapper {
            position: relative;
            cursor: pointer;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 18px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-icon-wrapper:hover {
            border-color: var(--accent-gold);
        }

        .cart-badge {
            background: var(--accent-gold);
            color: #000;
            font-weight: bold;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 12px;
        }

        .categories {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .cat-btn {
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .products-grid {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #fff;
        }

        .product-info {
            padding: 15px;
        }

        .product-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 10px;
        }

        .product-price {
            font-size: 20px;
            font-weight: 900;
            color: var(--success-color);
            margin-bottom: 15px;
        }

        .btn-add {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-add:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            left: -400px;
            width: 360px;
            height: 100%;
            background: var(--card-bg);
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .cart-drawer.open {
            left: 0;
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-body {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
        }

        .qty-btn {
            background: var(--border-color);
            color: #fff;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--accent-gold);
            color: #000;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            font-size: 16px;
            cursor: pointer;
            padding: 5px;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.5);
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        .checkout-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .qr-card {
            text-align: center;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 15px;
        }

        .store-links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .link-btn {
            background: #25d366;
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-btn.store {
            background: var(--accent-gold);
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-area">
                <h1>محلات نور الدين</h1>
                <p>مستلزمات الخياطة والأدوات المنزلية</p>
            </div>
            <div class="cart-icon-wrapper" onclick="toggleCart()">
                <i class="fas fa-shopping-bag" style="color: var(--accent-gold);"></i>
                <span>السلة</span>
                <span class="cart-badge" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <div class="categories">
        <button class="cat-btn active" onclick="filterCat('all', this)">الكل</button>
        <button class="cat-btn" onclick="filterCat('خيوط', this)">الخيوط</button>
        <button class="cat-btn" onclick="filterCat('مقصات', this)">المقصات</button>
        <button class="cat-btn" onclick="filterCat('سوست', this)">السوست</button>
    </div>

    <div class="products-grid" id="productsContainer"></div>

    <div class="checkout-section">
        <h2>معلومات المحل والتواصل</h2>
        <p>رقم الفودافون كاش والتواصل: <strong>01005195460</strong></p>
        
        <div class="store-links">
            <a href="https://wa.me/201005195460" target="_blank" class="link-btn">
                <i class="fab fa-whatsapp"></i> تواصل معنا عبر الواتساب
            </a>
            <a href="#" id="storeDirectLink" class="link-btn store">
                <i class="fas fa-store"></i> رابط المتجر
            </a>
        </div>

        <div style="margin-top: 25px;">
            <h3>رمز QR للوصول للمتجر:</h3>
            <div class="qr-card">
                <img id="qrImage" src="" alt="QR Code">
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>

    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3><i class="fas fa-shopping-cart"></i> سلة المشتريات</h3>
            <button style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-body" id="cartItemsList"></div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <span>الإجمالي:</span>
                <strong style="color: var(--success-color); font-size: 20px;"><span id="cartTotal">0</span> ج.م</strong>
            </div>
            <button class="btn-add" style="background: var(--accent-gold); color: #000;" onclick="sendOrderWhatsApp()">
                <i class="fab fa-whatsapp"></i> إرسال الطلب عبر الواتس
            </button>
        </div>
    </div>

    <script>
        const products = [
            { title: "بكرة خيط أبيض", price: 10, cat: "خيوط", image: "https://images.unsplash.com/photo-1605518216938-7c31b7b14ad0?w=500&auto=format&fit=crop&q=80" },
            { title: "طقم خيوط ألوان", price: 50, cat: "خيوط", image: "https://images.unsplash.com/photo-1528458909336-e7a0adfac1a5?w=500&auto=format&fit=crop&q=80" },
            { title: "مقص أطفالي", price: 15, cat: "مقصات", image: "https://images.unsplash.com/photo-1589256469067-ea99122bbdc4?w=500&auto=format&fit=crop&q=80" },
            { title: "مقص أدوات منزلية", price: 25, cat: "مقصات", image: "https://images.unsplash.com/photo-1618220179428-22790b461013?w=500&auto=format&fit=crop&q=80" },
            { title: "مقص أدوات المطبخ", price: 40, cat: "مقصات", image: "https://images.unsplash.com/photo-1503792501406-2c40da09e1e2?w=500&auto=format&fit=crop&q=80" },
            { title: "سوستة بنطلون 20 سم", price: 5, cat: "سوست", image: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=500&auto=format&fit=crop&q=80" },
            { title: "سوستة جاكيت سحرية", price: 12, cat: "سوست", image: "https://images.unsplash.com/photo-1544816155-12df9643f363?w=500&auto=format&fit=crop&q=80" }
        ];

        let cart = {};

        function renderProducts(category = 'all') {
            const container = document.getElementById('productsContainer');
            container.innerHTML = '';
            
            const filtered = category === 'all' ? products : products.filter(p => p.cat === category);

            filtered.forEach(p => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" class="product-img" alt="${p.title}">
                        <div class="product-info">
                            <h3 class="product-title">${p.title}</h3>
                            <div class="product-price">${p.price} ج.م</div>
                            <button class="btn-add" onclick="addToCart('${p.title}', ${p.price})">
                                <i class="fas fa-plus"></i> إضافة للسلة
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCat(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat);
        }

        function addToCart(title, price) {
            if(cart[title]) cart[title].qty++;
            else cart[title] = { price: price, qty: 1 };
            updateCart();
            toggleCart(true);
        }

        function changeQty(title, delta) {
            if(cart[title]) {
                cart[title].qty += delta;
                if(cart[title].qty <= 0) delete cart[title];
            }
            updateCart();
        }

        function deleteItem(title) {
            delete cart[title];
            updateCart();
        }

        function updateCart() {
            let total = 0, count = 0;
            const container = document.getElementById('cartItemsList');
            container.innerHTML = '';

            for(let name in cart) {
                let itemTotal = cart[name].qty * cart[name].price;
                total += itemTotal;
                count += cart[name].qty;

                container.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <div><strong>${name}</strong></div>
                            <div style="color:var(--text-secondary); font-size:12px;">${cart[name].price} ج.م للقطعة</div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty('${name}', -1)">-</button>
                                <span>${cart[name].qty}</span>
                                <button class="qty-btn" onclick="changeQty('${name}', 1)">+</button>
                            </div>
                        </div>
                        <div style="text-align: left;">
                            <button class="delete-btn" onclick="deleteItem('${name}')"><i class="fas fa-trash-alt"></i></button>
                            <div style="color:var(--success-color); font-weight:bold; margin-top:5px;">${itemTotal} ج</div>
                        </div>
                    </div>
                `;
            }

            document.getElementById('cart-count').innerText = count;
            document.getElementById('cartTotal').innerText = total;
        }

        function toggleCart(open = null) {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('overlay');
            if(open === true || !drawer.classList.contains('open')) {
                drawer.classList.add('open');
                overlay.classList.add('active');
            } else {
                drawer.classList.remove('open');
                overlay.classList.remove('active');
            }
        }

        function sendOrderWhatsApp() {
            if(Object.keys(cart).length === 0) return alert('السلة فارغة!');
            
            let message = "السلام عليكم، حابب أطلب من محلات نور الدين:\n\n";
            let total = 0;

            for(let item in cart) {
                let itemTotal = cart[item].qty * cart[item].price;
                total += itemTotal;
                message += `• ${item} (العدد: ${cart[item].qty}) - ${itemTotal} ج.م\n`;
            }

            message += `\nإجمالي المبلغ: ${total} ج.م`;
            
            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/201005195460?text=${encodedMessage}`, '_blank');
        }

        // إعداد الروابط والـ QR بناءً على رابط الموقع الحالي
        const currentUrl = window.location.href;
        document.getElementById('storeDirectLink').href = currentUrl;
        document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}`;

        renderProducts();
    </script>
</body>
</html>
