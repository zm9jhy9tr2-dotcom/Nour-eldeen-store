<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض المنتجات</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 40px 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }
    .card {
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #334155;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .img-box {
      width: 100%;
      height: 320px;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .info {
      padding: 20px;
      text-align: center;
    }
    .title {
      font-size: 1.1rem;
      font-weight: 500;
      color: #e2e8f0;
      margin-bottom: 12px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>قائمة المنتجات</h1>
    <div class="grid">

      <div class="card">
        <div class="img-box">
          <img src="image_9.png" alt="مقس مطبخ أسود">
        </div>
        <div class="info">
          <div class="title">مقص مطبخ متعدد الاستخدامات</div>
          <button class="btn">عرض التفاصيل</button>
        </div>
      </div>

      <div class="card">
        <div class="img-box">
          <img src="image_10.png" alt="مقص أزرق Bongione">
        </div>
        <div class="info">
          <div class="title">مقص مكتب أزرق - Bongione</div>
          <button class="btn">عرض التفاصيل</button>
        </div>
      </div>

      <div class="card">
        <div class="img-box">
          <img src="image_11.png" alt="مقص برتقالي Eterna">
        </div>
        <div class="info">
          <div class="title">مقص احترافي برتقالي - Eterna</div>
          <button class="btn">عرض التفاصيل</button>
        </div>
      </div>

      <div class="card">
        <div class="img-box">
          <img src="image_12.png" alt="بكرة خيط أسود">
        </div>
        <div class="info">
          <div class="title">بكرة خيط أسود سميك</div>
          <button class="btn">عرض التفاصيل</button>
        </div>
      </div>

      <div class="card">
        <div class="img-box">
          <img src="image_13.png" alt="مسدس شمع أزرق Etman">
        </div>
        <div class="info">
          <div class="title">مسدس شمع أزرق - Etman Group</div>
          <button class="btn">عرض التفاصيل</button>
        </div>
      </div>

      <div class="card">
        <div class="img-box">
          <img src="image_14.png" alt="بكرة خيط أبيض Star">
        </div>
        <div class="info">
          <div class="title">بكرة خيط أبيض - Star</div>
          <button class="btn">عرض التفاصيل</button>
        </div>
      </div>

      <div class="card">
        <div class="img-box">
          <img src="image_15.png" alt="بكرة خيط رمادي AMA">
        </div>
        <div class="info">
          <div class="title">بكرة خيط رمادي - AMA النموري</div>
          <button class="btn">عرض التفاصيل</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
